    <!-- Early Capture of PWA Install Prompt & Canonical Initialization -->
    <script>
      window.__biqatDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__biqatDeferredPrompt = e;
        window.dispatchEvent(new Event('biqat-pwa-prompt'));
      });
      (function () {
        if (!window.location) return;
        var origin = window.location.origin;
        var canonicalUrl = origin + window.location.pathname;
        var canonical = document.getElementById('canonical-link');
        if (canonical) canonical.setAttribute('href', canonicalUrl);
        var ogUrl = document.querySelector('meta[property="og:url"]');
        if (ogUrl) ogUrl.setAttribute('content', canonicalUrl);
        var ogImg = document.querySelector('meta[property="og:image"]');
        if (ogImg) ogImg.setAttribute('content', origin + '/og-social-card.png');
        var twImg = document.querySelector('meta[name="twitter:image"]');
        if (twImg) twImg.setAttribute('content', origin + '/og-social-card.png');
      })();
    </script>
